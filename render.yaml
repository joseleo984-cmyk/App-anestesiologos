# Blueprint de Render: la app en el plan gratis. La base de datos y las órdenes
# (fotos/PDF) están en Supabase. En Render: New > Blueprint > este repositorio.
services:
  - type: web
    name: app-anestesiologos
    runtime: python
    plan: free               # se duerme tras ~15 min sin uso; el primer acceso tarda ~1 min
    region: virginia         # junto a Supabase "East US (North Virginia)"
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render atiende el HTTPS y le pasa la solicitud a la app
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /salud
    envVars:
      - key: COOKIE_SEGURA
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_BUCKET
        value: ordenes
      # Render los pide al crear el Blueprint (no se guardan en el repositorio)
      - key: DATABASE_URL          # Supabase > Connect > Session pooler
        sync: false
      - key: SUPABASE_URL          # Supabase > Project Settings > API > Project URL
        sync: false
      - key: SUPABASE_SERVICE_KEY  # Supabase > Project Settings > API keys > service_role / secret
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
