# Blueprint de Render: crea la base de datos, la app y el disco de las órdenes.
# En Render: New > Blueprint > elegir este repositorio.
databases:
  - name: anestesia-db
    databaseName: anestesia
    user: anestesia
    plan: basic-256mb
    region: virginia

services:
  - type: web
    name: app-anestesiologos
    runtime: python
    plan: starter            # el disco permanente requiere un plan pago
    region: virginia         # misma región que la base de datos
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render atiende el HTTPS y le pasa la solicitud a la app
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /salud
    disk:
      name: ordenes
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anestesia-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: COOKIE_SEGURA
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      # Estos tres los pide Render al crear el Blueprint (no se guardan en el repositorio)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
