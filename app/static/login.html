<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditorías AP · Iniciar sesión</title>
<link rel="icon" type="image/png" href="/static/icono-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auditorías AP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6bcb">
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470; --line: #d9dde3;
          --accent: #0b6bcb; --accent-text: #ffffff; --err-bg: #fde8e8; --err-text: #a61b1b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151a; --card: #1b2028; --text: #e7eaee; --muted: #9aa4b1; --line: #313844;
            --accent: #4b9cf0; --accent-text: #0b0f14; --err-bg: #3d1c1c; --err-text: #f1a3a3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 400px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--text); }
  button { width: 100%; margin-top: 20px; font: inherit; font-weight: 600; padding: 12px; border-radius: 10px;
           border: 0; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button:disabled { opacity: .6; }
  .error { background: var(--err-bg); color: var(--err-text); padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <img src="/static/icono-192.png" alt="" width="72" height="72" style="border-radius:16px;display:block;margin:0 auto 12px">
  <h1 style="text-align:center">Auditorías AP</h1>
  <p style="text-align:center">Anestesiólogos Permanentes</p>
  <p>Inicia sesión para continuar.</p>
  <form id="login">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div id="error"></div>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
document.getElementById("login").onsubmit = async (ev) => {
  ev.preventDefault();
  const boton = ev.submitter, error = document.getElementById("error");
  boton.disabled = true; error.innerHTML = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }),
    });
    if (r.ok) { location.href = "/"; return; }
    const cuerpo = await r.json().catch(() => null);
    error.innerHTML = `<div class="error"></div>`;
    error.firstChild.textContent = (cuerpo && typeof cuerpo.detail === "string") ? cuerpo.detail : "No se pudo iniciar sesión.";
  } catch {
    error.innerHTML = `<div class="error">Sin conexión. Intenta de nuevo.</div>`;
  } finally {
    boton.disabled = false;
  }
};
</script>
</body>
</html>
